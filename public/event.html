<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO 测试</title>
    <!-- 完全使用 daisyUI，不要写 custom；页面样式优先使用 daisyUI 原生类。 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@latest/css/iconoir.css" />
    <!-- Alpine 的 x-cloak 防止状态初始化前出现闪烁。 -->
    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content" data-theme="dark">
    <!-- 使用 Alpine 管理 Socket.IO 连接状态、房间操作和事件日志。 -->
    <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:py-10" x-data="wsTest()" x-cloak>
      <header class="navbar mb-8 rounded-box border border-base-300 bg-base-100 px-3 shadow-sm"><div class="flex-1"><a class="btn btn-ghost gap-2" href="/index.html"><span class="iconoir-nav-arrow-left"></span>返回首页</a></div><a class="btn btn-ghost text-lg font-semibold tracking-tight" href="/index.html">Mige</a></header>
      <div class="mb-10"><div class="badge badge-primary badge-outline mb-4 gap-2"><span class="iconoir-wifi"></span>Realtime</div><h1 class="text-3xl font-bold tracking-tight">Socket.IO 测试</h1><p class="mt-3 leading-7 text-base-content/65">连接 <code class="rounded bg-base-300 px-1.5 py-0.5 text-sm">/events</code> 命名空间，加入房间后可向房间内所有客户端发送消息。</p></div>
      <article class="alert mb-7" :class="status.includes('已连接') ? 'alert-success' : 'alert-info'">
        <span class="iconoir-wifi"></span><div><h2 class="font-semibold">连接状态</h2><p class="text-sm" aria-live="polite" x-text="status">正在连接…</p></div>
      </article>
      <div class="grid gap-6 lg:grid-cols-2">
        <article class="card border border-base-300 bg-base-100 shadow-sm">
          <div class="card-body gap-6 p-7">
            <div><p class="text-xs font-medium uppercase tracking-widest text-base-content/45">Step 1</p><h2 class="mt-1 font-semibold">加入房间</h2></div>
            <form @submit.prevent="joinRoom">
              <label class="form-control" for="roomId">
                <span class="label-text mb-2">房间 ID</span>
                <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-2">
                  <input class="input input-bordered min-w-0 w-full" id="roomId" x-model="roomId" name="roomId" placeholder="general" required :disabled="currentRoom" />
                  <button class="btn btn-primary whitespace-nowrap" type="submit" x-show="!currentRoom">加入房间</button>
                  <button class="btn btn-error whitespace-nowrap" type="button" x-show="currentRoom" @click="leaveRoom">离开房间</button>
                </div>
              </label>
            </form>
          </div>
        </article>

        <article class="card border border-base-300 bg-base-100 shadow-sm">
          <div class="card-body gap-6 p-7">
            <div><p class="text-xs font-medium uppercase tracking-widest text-base-content/45">Step 2</p><h2 class="mt-1 font-semibold">发送消息</h2></div>
            <form @submit.prevent="sendMessage">
              <label class="form-control" for="msgInput">
                <span class="label-text mb-2">消息内容</span>
                <div class="grid grid-cols-[minmax(0,1fr)_auto] gap-2">
                  <input class="input input-bordered min-w-0 w-full" id="msgInput" x-ref="message" x-model="message" name="message" placeholder="输入消息…" autocomplete="off" required :disabled="!currentRoom" />
                  <button class="btn btn-primary whitespace-nowrap" type="submit" :disabled="!currentRoom">发送</button>
                </div>
              </label>
              <p class="text-sm text-base-content/55" x-text="currentRoom ? '正在向房间“' + currentRoom + '”发送消息。' : '请先加入一个房间。'"></p>
            </form>
          </div>
        </article>
      </div>
      <article class="card mt-7 border border-base-300 bg-base-100 shadow-sm"><div class="card-body p-0">
        <div class="flex items-center justify-between border-b border-base-300 px-5 py-4"><h2 class="font-semibold">事件日志</h2><span class="badge badge-ghost" x-text="messages.length + ' 条'"></span></div><div class="overflow-x-auto"><table class="table table-zebra">
          <thead>
            <tr>
              <th scope="col">时间</th>
              <th scope="col">事件</th>
              <th scope="col">详情</th>
            </tr>
          </thead>
          <tbody aria-live="polite">
            <template x-for="item in messages" :key="item.id">
              <tr>
                <td x-text="item.time"></td>
                <td x-text="item.event"></td>
                <td x-text="item.detail"></td>
              </tr>
            </template>
          </tbody></table></div></div></article>
    </main>

    <!-- 逻辑使用 alpine.js 实现 -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
      function wsTest() {
        return {
          status: "正在连接…",
          roomId: "general",
          currentRoom: null,
          message: "",
          messages: [],
          socket: null,

          init() {
            const accessToken = localStorage.getItem("accessToken");
            this.socket = io("/events", {
              transports: ["websocket"],
              auth: { authorization: accessToken ? `Bearer ${accessToken}` : "" },
            });
            this.socket.on("connect", () => { this.status = "已连接（" + this.socket.id + "）"; this.log("connect", "已连接到服务器"); });
            this.socket.on("disconnect", () => { this.status = "连接已断开"; this.currentRoom = null; this.log("disconnect", "与服务器断开连接"); });
            this.socket.on("connect_error", (error) => { this.status = "连接失败：" + error.message; this.log("connect_error", "连接失败：" + error.message); });
            this.socket.on("user_joined", (data) => this.log("user_joined", "用户加入：" + data.userId));
            this.socket.on("user_left", (data) => this.log("user_left", "用户离开：" + data.userId));
            this.socket.on("new_message", (data) => this.log("new_message", (data.senderId === this.socket.id ? "你" : data.senderId) + "：" + data.message));
            this.socket.on("error", (data) => { const message = data?.message ?? "发生未知错误"; this.status = "连接错误：" + message; this.log("error", "错误：" + message); });
          },

          log(event, detail) { this.messages.unshift({ id: crypto.randomUUID(), time: new Date().toLocaleTimeString("zh-CN"), event, detail }); },
          joinRoom() {
            const room = this.roomId.trim();
            if (!room) return;
            this.socket.emit("join_room", { roomId: room }, (response) => {
              if (!response?.roomId) return this.log("join_room", "加入房间失败");
              this.currentRoom = response.roomId;
              this.log("join_room", "已加入房间：" + response.roomId);
              this.$nextTick(() => this.$refs.message.focus());
            });
          },
          leaveRoom() {
            if (!this.currentRoom) return;
            const room = this.currentRoom;
            this.socket.emit("leave_room", { roomId: room }, () => { this.currentRoom = null; this.log("leave_room", "已离开房间：" + room); });
          },
          sendMessage() {
            const message = this.message.trim();
            if (!message || !this.currentRoom) return;
            this.socket.emit("send_message", { roomId: this.currentRoom, message });
            this.message = "";
            this.$nextTick(() => this.$refs.message.focus());
          },
        };
      }
    </script>
  </body>
</html>
