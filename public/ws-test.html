<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO 测试</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css" />
  </head>
  <body>
    <main x-data="wsTest()">
      <header>
        <nav aria-label="页面导航"><a href="/index.html">返回首页</a></nav>
      </header>
      <h1>Socket.IO 测试</h1>
      <p>连接 <code>/events</code> 命名空间，加入房间后可向房间内所有客户端发送消息。</p>

      <article>
        <header>
          <strong>连接状态</strong>
          <span aria-live="polite" x-text="status">正在连接…</span>
        </header>
        <p><small>此接口需要登录会话；未登录时请先前往登录页。</small></p>
        <p><a href="/auth.html">前往登录</a></p>
      </article>

      <article>
        <form @submit.prevent="joinRoom">
          <label for="roomId">房间 ID</label>
          <p>
            <input id="roomId" x-model="roomId" name="roomId" placeholder="general" required :disabled="currentRoom" />
            <button type="submit" x-show="!currentRoom">加入房间</button>
            <button type="button" x-show="currentRoom" @click="leaveRoom">离开房间</button>
          </p>
        </form>

        <form @submit.prevent="sendMessage">
          <label for="msgInput">消息</label>
          <p>
            <input id="msgInput" x-ref="message" x-model="message" name="message" placeholder="输入消息…" autocomplete="off" required :disabled="!currentRoom" />
            <button type="submit" :disabled="!currentRoom">发送</button>
          </p>
          <small x-text="currentRoom ? '正在向房间“' + currentRoom + '”发送消息。' : '请先加入一个房间。'"></small>
        </form>
      </article>

      <article>
        <header><strong>事件日志</strong></header>
        <table>
          <thead>
            <tr>
              <th scope="col">时间</th>
              <th scope="col">事件</th>
              <th scope="col">详情</th>
            </tr>
          </thead>
          <tbody aria-live="polite">
            <template x-for="item in messages" :key="item.id">
              <tr>
                <td x-text="item.time"></td>
                <td x-text="item.event"></td>
                <td x-text="item.detail"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </article>
    </main>

    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script>
      function wsTest() {
        return {
          status: "正在连接…",
          roomId: "general",
          currentRoom: null,
          message: "",
          messages: [],
          socket: null,

          init() {
            this.socket = io("/events", { transports: ["websocket"], withCredentials: true });
            this.socket.on("connect", () => { this.status = "已连接（" + this.socket.id + "）"; this.log("connect", "已连接到服务器"); });
            this.socket.on("disconnect", () => { this.status = "连接已断开"; this.currentRoom = null; this.log("disconnect", "与服务器断开连接"); });
            this.socket.on("connect_error", (error) => { this.status = "连接失败：" + error.message; this.log("connect_error", "连接失败：" + error.message); });
            this.socket.on("user_joined", (data) => this.log("user_joined", "用户加入：" + data.userId));
            this.socket.on("user_left", (data) => this.log("user_left", "用户离开：" + data.userId));
            this.socket.on("new_message", (data) => this.log("new_message", (data.senderId === this.socket.id ? "你" : data.senderId) + "：" + data.message));
            this.socket.on("error", (data) => { const message = data?.message ?? "发生未知错误"; this.status = "连接错误：" + message; this.log("error", "错误：" + message); });
          },

          log(event, detail) { this.messages.push({ id: crypto.randomUUID(), time: new Date().toLocaleTimeString("zh-CN"), event, detail }); },
          joinRoom() {
            const room = this.roomId.trim();
            if (!room) return;
            this.socket.emit("join_room", { roomId: room }, (response) => {
              if (!response?.roomId) return this.log("join_room", "加入房间失败");
              this.currentRoom = response.roomId;
              this.log("join_room", "已加入房间：" + response.roomId);
              this.$nextTick(() => this.$refs.message.focus());
            });
          },
          leaveRoom() {
            if (!this.currentRoom) return;
            const room = this.currentRoom;
            this.socket.emit("leave_room", { roomId: room }, () => { this.currentRoom = null; this.log("leave_room", "已离开房间：" + room); });
          },
          sendMessage() {
            const message = this.message.trim();
            if (!message || !this.currentRoom) return;
            this.socket.emit("send_message", { roomId: this.currentRoom, message });
            this.message = "";
            this.$nextTick(() => this.$refs.message.focus());
          },
        };
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
  </body>
</html>
