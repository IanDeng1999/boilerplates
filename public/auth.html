<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 / 注册</title>
    <!-- 完全使用 daisyUI，不要写 custom；页面样式优先使用 daisyUI 原生类。 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@latest/css/iconoir.css" />
    <style>
      [x-cloak] { display: none !important; }
    </style>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content" data-theme="dark">
    <!-- 使用 Alpine 管理授权流程、表单状态、会话展示与错误反馈。 -->
    <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:py-10" x-data="authPage" x-cloak>
      <header class="navbar mb-8 rounded-box border border-base-300 bg-base-100 px-3 shadow-sm"><div class="flex-1"><a class="btn btn-ghost gap-2" href="/index.html"><span class="iconoir-nav-arrow-left"></span>返回首页</a></div><a class="btn btn-ghost text-lg font-semibold tracking-tight" href="/index.html">Mige</a></header>
      <div class="mb-10"><div class="badge badge-primary badge-outline mb-4 gap-2"><span class="iconoir-user"></span>Account</div><h1 class="text-3xl font-bold tracking-tight">登录 / 注册</h1><p class="mt-3 leading-7 text-base-content/65">验证身份后，即可继续使用控制台服务。</p></div>
      <section class="card border border-base-300 bg-base-100 shadow-sm">
      <div class="card-body p-6 sm:p-8">

      <!-- 登录态：当前账户 + 登出 -->
      <article x-show="account">
        <div class="flex flex-col gap-5 border-b border-base-300 pb-6 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex items-center gap-4"><div class="avatar placeholder"><div class="w-14 rounded-box bg-primary text-lg text-primary-content"><img x-show="account?.avatar" :src="account?.avatar" :alt="account?.username ?? 'avatar'" /><span x-show="!account?.avatar" x-text="(account?.username ?? '?').slice(0, 1).toUpperCase()"></span></div></div><div><p class="text-xs font-medium uppercase tracking-widest text-base-content/45">Signed in</p><h2 class="mt-2 text-xl font-semibold" x-text="account?.username ?? account?.id"></h2><p class="mt-1 text-sm text-base-content/55">当前会话已生效</p></div></div>
          <div class="badge badge-success badge-outline gap-2"><span class="iconoir-check-circle"></span>已验证</div>
        </div>
        <div class="mt-7 grid gap-4 sm:grid-cols-3">
          <div class="rounded-box border border-base-300 p-4"><p class="text-xs text-base-content/50">账户 ID</p><code class="mt-2 block break-all text-sm" x-text="account?.id"></code></div>
          <div class="rounded-box border border-base-300 p-4"><p class="text-xs text-base-content/50">邮箱</p><p class="mt-2 break-all text-sm" x-text="account?.email ?? '—'"></p></div>
          <div class="rounded-box border border-base-300 p-4"><p class="text-xs text-base-content/50">创建时间</p><p class="mt-2 text-sm" x-text="account?.createdAt ? new Date(account.createdAt).toLocaleString('zh-CN') : '—'"></p></div>
        </div>
        <div class="mt-7 flex flex-wrap items-center gap-3 border-t border-base-300 pt-6"><button class="btn btn-ghost" :disabled="loading" @click="checkAccount()"><span class="iconoir-refresh"></span>校验会话</button><button class="btn btn-error btn-outline" :disabled="loading" @click="logout()">退出登录</button></div>
      </article>

      <!-- 未登录：登录 / 注册入口 -->
      <article x-show="!account">
        <div role="tablist" class="tabs tabs-border"><button type="button" role="tab" class="tab flex-1" :class="{ 'tab-active': tab === 'login' }" @click="tab = 'login'">登录</button><button type="button" role="tab" class="tab flex-1" :class="{ 'tab-active': tab === 'register' }" @click="tab = 'register'">注册</button></div>
        <p class="mt-5 text-sm leading-6 text-base-content/65" x-show="tab === 'login'">已注册过的账号，直接授权即可。</p>
        <p class="mt-5 text-sm leading-6 text-base-content/65" x-show="tab === 'register'">没有账号密码注册接口，首次授权即建档；相同邮箱的第三方账号会自动合并。</p>
        <div class="mt-6 grid gap-3 sm:grid-cols-2">
          <template x-for="provider in providers" :key="provider.id">
            <button class="btn btn-outline w-full" :disabled="loading" @click="startOAuth(provider.id)">
              <span x-text="provider.label"></span><span x-text="tab === 'login' ? ' 登录' : ' 注册'"></span>
            </button>
          </template>
        </div>
        <div class="divider my-8 text-xs text-base-content/50">或使用手机号</div>
        <form @submit.prevent="loginWithPhone()">
          <div>
            <label class="block text-sm font-medium" for="phone">手机号（E.164 格式）</label>
            <input class="input input-bordered mt-3 w-full" id="phone" x-model.trim="phone" type="tel" placeholder="+8613800138000" required />
          </div>
          <div class="mt-7">
            <label class="block text-sm font-medium" for="code">验证码</label>
            <div class="mt-3 grid grid-cols-[minmax(0,1fr)_auto] gap-3">
              <input class="input input-bordered min-w-0 w-full" id="code" x-model.trim="code" inputmode="numeric" pattern="[0-9]{6}" placeholder="请输入 6 位验证码" required />
              <button class="btn btn-outline whitespace-nowrap" type="button" :disabled="loading || !phone" @click="requestPhoneCode()">获取验证码</button>
            </div>
          </div>
          <button class="btn btn-primary mt-8 w-full" type="submit" :disabled="loading"><span class="loading loading-spinner loading-sm" x-show="loading"></span>手机号登录</button>
        </form>
        <p class="mt-8 border-t border-base-300 pt-5 text-xs leading-6 text-base-content/50">第三方回调地址需指向后端 <code>/api/auth/callback/{provider}</code>，由后端换码后重定向回本页。</p>
      </article>

      <div class="alert alert-error mt-5" x-show="error" role="alert"><span class="iconoir-warning-triangle"></span><span x-text="error"></span></div>
      </div>
      </section>

    </main>

    <!-- 逻辑使用 alpine.js 实现 -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("authPage", () => ({
          providers: [
            { id: "github", label: "GitHub" },
            { id: "google", label: "Google" },
          ],
          phone: "",
          code: "",
          tab: "login",
          loading: false,
          account: null,
          error: "",
          accessToken: localStorage.getItem("accessToken") ?? "",

          init() {
            const params = new URLSearchParams(window.location.search);
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const accessToken = fragment.get("access_token");
            if (accessToken) {
              this.setAccessToken(accessToken);
            }
            // 后端回调成功后重定向回本页，失败时带 loginError
            const loginError = params.get("loginError");
            const failure = params.get("error");
            if (loginError) {
              this.fail(loginError);
            } else if (failure) {
              this.fail(params.get("error_description") ?? `授权失败：${failure}`);
            }
            window.history.replaceState({}, "", window.location.pathname);
            this.checkAccount();
          },

          async startOAuth(provider) {
            this.loading = true;
            this.error = "";
            const { ok, payload } = await this.call(
              `/api/auth/login/${provider}`,
            );
            this.loading = false;
            if (!ok || !payload?.data?.url) {
              return this.fail(payload?.msg ?? "获取授权地址失败");
            }
            window.location.assign(payload.data.url);
          },

          async requestPhoneCode() {
            this.loading = true;
            this.error = "";
            const { ok, payload } = await this.call("/api/user/phone/code", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone: this.phone }),
            });
            this.loading = false;
            if (!ok) this.fail(payload?.msg ?? "发送验证码失败");
          },

          async loginWithPhone() {
            this.loading = true;
            this.error = "";
            const { ok, payload } = await this.call("/api/user/phone/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone: this.phone, code: this.code }),
            });
            this.loading = false;
            if (!ok) return this.fail(payload?.msg ?? "登录失败");
            this.setAccessToken(payload?.data?.accessToken);
            this.account = payload?.data?.user ?? null;
          },

          async checkAccount() {
            const { ok, payload } = await this.call("/api/user/me");
            this.account = ok ? (payload?.data ?? null) : null;
          },

          async logout() {
            this.loading = true;
            const { ok, payload } = await this.call("/api/user/logout", {
              method: "POST",
            });
            this.loading = false;
            if (!ok) return this.fail(payload?.msg ?? "登出失败");

            this.account = null;
            this.setAccessToken("");
            this.error = "";
            this.tab = "login";
          },

          async call(path, options = {}) {
            const headers = new Headers(options.headers);
            if (this.accessToken) {
              headers.set("Authorization", `Bearer ${this.accessToken}`);
            }
            const response = await fetch(path, { ...options, headers });
            const payload = await response.json().catch(() => null);
            return { ok: response.ok, status: response.status, payload };
          },

          setAccessToken(accessToken) {
            this.accessToken = accessToken ?? "";
            if (this.accessToken) localStorage.setItem("accessToken", this.accessToken);
            else localStorage.removeItem("accessToken");
          },

          fail(message) {
            this.error = message;
          },
        }));
      });
    </script>
  </body>
</html>
