<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mige 控制台</title>
    <!-- 完全使用 daisyUI，不要写 custom；页面样式优先使用 daisyUI 原生类。 -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@latest/css/iconoir.css" />
  </head>
  <body class="min-h-screen bg-base-200 text-base-content" data-theme="dark">
    <main class="mx-auto max-w-5xl px-4 py-6 sm:px-6 lg:py-10">
      <header class="navbar mb-8 rounded-box border border-base-300 bg-base-100 px-3 shadow-sm">
        <div class="flex-1">
          <a class="btn btn-ghost text-xl font-semibold tracking-tight" href="/index.html">Mige</a>
        </div>
        <div class="flex-none">
          <a class="btn btn-ghost btn-sm hidden sm:inline-flex" href="/reference">接口参考</a>
          <a class="btn btn-ghost btn-square btn-sm sm:hidden" href="/reference" aria-label="接口参考"><span class="iconoir-book"></span></a>
        </div>
      </header>

      <section class="overflow-hidden rounded-box border border-base-300 bg-base-100 shadow-sm">
        <div class="hero-content w-full max-w-5xl flex-col items-start py-10 sm:py-14">
          <div class="badge badge-primary badge-outline gap-2 font-medium"><span class="iconoir-terminal" aria-hidden="true"></span>Developer console</div>
          <h1 class="max-w-3xl text-4xl font-bold tracking-tight sm:text-5xl">把每一项服务能力，
            <span class="text-primary">清晰地跑一遍。</span></h1>
          <p class="max-w-2xl leading-7 text-base-content/65 sm:text-lg">在同一个控制台中验证授权、对象存储、实时通信与分类数据；页面直接连接当前服务，无需额外配置。</p>
          <div class="divider my-2 w-full"></div>
          <div class="grid w-full gap-4 pt-3 sm:grid-cols-2">
            <a class="card border border-base-300 bg-base-100 transition duration-200 hover:-translate-y-1 hover:border-primary hover:shadow-lg" href="/auth.html">
              <div class="card-body p-5"><span class="iconoir-user text-2xl text-primary" aria-hidden="true"></span><h2 class="card-title">登录与注册</h2><p class="text-sm text-base-content/65">OAuth 和手机验证码登录</p><div class="card-actions justify-end"><span class="btn btn-ghost btn-sm">进入 <span class="iconoir-arrow-right"></span></span></div></div>
            </a>
            <a class="card border border-base-300 bg-base-100 transition duration-200 hover:-translate-y-1 hover:border-primary hover:shadow-lg" href="/upload.html">
              <div class="card-body p-5"><span class="iconoir-upload text-2xl text-primary" aria-hidden="true"></span><h2 class="card-title">文件上传</h2><p class="text-sm text-base-content/65">SHA-256 校验与 OSS 直传</p><div class="card-actions justify-end"><span class="btn btn-ghost btn-sm">进入 <span class="iconoir-arrow-right"></span></span></div></div>
            </a>
            <a class="card border border-base-300 bg-base-100 transition duration-200 hover:-translate-y-1 hover:border-primary hover:shadow-lg" href="/event.html">
              <div class="card-body p-5"><span class="iconoir-wifi text-2xl text-primary" aria-hidden="true"></span><h2 class="card-title">Socket.IO</h2><p class="text-sm text-base-content/65">加入房间并发送实时消息</p><div class="card-actions justify-end"><span class="btn btn-ghost btn-sm">进入 <span class="iconoir-arrow-right"></span></span></div></div>
            </a>
          </div>
        </div>
      </section>
    </main>

  </body>
</html>
